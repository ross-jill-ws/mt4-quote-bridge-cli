<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" role="img" aria-labelledby="title desc">
  <title id="title">How a screenshot is taken</title>
  <desc id="desc">Sequence from the CLI to the QuoteBridge app and its window: the CLI resolves the market and checks the output file, asks the app, the app checks scope and the window, switches the window's view without showing it, waits for the chart to draw, captures it and answers the PNG with the window's health; the CLI prints the health or writes the PNG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #2c3e50; }
      .head { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 11.5px; fill: #ffffff; opacity: .9; }
      .b { font-size: 13.5px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #34495e; }
      .m { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 12px; fill: #2c3e50; }
      .bad { font-size: 12.5px; fill: #c0392b; }
      .ok { font-size: 12.5px; fill: #1e8449; }
      .life { stroke: #95a5a6; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .msg { stroke: #2c3e50; stroke-width: 1.6; fill: none; }
      .ret { stroke: #2c3e50; stroke-width: 1.6; fill: none; stroke-dasharray: 7 4; }
    </style>
  </defs>
  <rect width="980" height="800" fill="#ffffff"/>

  <!-- lane heads -->
  <rect x="40" y="20" width="240" height="58" rx="8" fill="#3498db"/>
  <text x="160" y="46" text-anchor="middle" class="head">mt4-quote-bridge</text>
  <text x="160" y="65" text-anchor="middle" class="sub">the CLI, on your computer</text>
  <rect x="370" y="20" width="240" height="58" rx="8" fill="#2c3e50"/>
  <text x="490" y="46" text-anchor="middle" class="head">QuoteBridge app</text>
  <text x="490" y="65" text-anchor="middle" class="sub">REST API v1 on 127.0.0.1:5580</text>
  <rect x="700" y="20" width="240" height="58" rx="8" fill="#27ae60"/>
  <text x="820" y="46" text-anchor="middle" class="head">The app window</text>
  <text x="820" y="65" text-anchor="middle" class="sub">the user's own, wherever it is</text>

  <line x1="160" y1="78" x2="160" y2="780" class="life"/>
  <line x1="490" y1="78" x2="490" y2="780" class="life"/>
  <line x1="820" y1="78" x2="820" y2="780" class="life"/>

  <!-- 1 resolve -->
  <rect x="24" y="96" width="420" height="70" rx="6" fill="#e8f4f8" stroke="#3498db"/>
  <text x="38" y="117" class="b">① Name the market exactly (screenshot chart only)</text>
  <text x="38" y="137" class="m">GET /api/v1/markets?symbol=EURUSD&amp;brokerServer=…</text>
  <text x="38" y="156" class="bad">ambiguous → exit 6 · unknown → exit 5 · window untouched</text>

  <!-- 2 output check -->
  <rect x="24" y="180" width="420" height="52" rx="6" fill="#e8f4f8" stroke="#3498db"/>
  <text x="38" y="201" class="b">② --output FILE already exists and no --force?</text>
  <text x="38" y="221" class="bad">→ exit 13 (output-exists) before the app is asked · window untouched</text>

  <!-- 3 request -->
  <text x="325" y="256" text-anchor="middle" class="m"><tspan class="b">③ </tspan>GET /api/v1/screenshots/feeds</text>
  <text x="325" y="272" text-anchor="middle" class="m">or …/screenshots/charts/{marketId}</text>
  <line x1="160" y1="284" x2="486" y2="284" class="msg" marker-end="url(#arrow)"/>
  <text x="325" y="301" text-anchor="middle" class="s">Authorization: Bearer &lt;trader key&gt;</text>

  <!-- 4 checks -->
  <rect x="316" y="316" width="348" height="128" rx="6" fill="#f4f6f7" stroke="#2c3e50"/>
  <text x="330" y="337" class="b">④ The app checks, then waits its turn</text>
  <text x="330" y="357" class="bad">readonly key → 403 insufficient-scope (exit 4)</text>
  <text x="330" y="375" class="bad">a dialog is open → 409 window-busy (exit 7)</text>
  <text x="330" y="393" class="bad">chart, no terminal streams it → 409 no-feed (exit 7)</text>
  <text x="330" y="411" class="bad">no window yet → 503 window-unavailable (exit 9)</text>
  <text x="330" y="431" class="s">One screenshot at a time; others queue.</text>

  <!-- 5 switch -->
  <text x="655" y="468" text-anchor="middle" class="b">⑤ Switch the view</text>
  <line x1="490" y1="478" x2="816" y2="478" class="msg" marker-end="url(#arrow)"/>
  <text x="655" y="496" text-anchor="middle" class="s">Feeds, or Charts on the market's best source feed</text>

  <!-- 6 draw + capture -->
  <rect x="664" y="512" width="306" height="132" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="678" y="533" class="b">⑥ Draw, then capture</text>
  <text x="678" y="553" class="s">Stays visible, minimised or hidden in the</text>
  <text x="678" y="570" class="s">tray: never shown, never focused.</text>
  <text x="678" y="590" class="s">A chart waits for candles, indicator values</text>
  <text x="678" y="607" class="s">and trades, six seconds at most.</text>
  <text x="678" y="629" class="bad">over ten seconds → 504 screenshot-timeout (9)</text>

  <!-- 7 answer -->
  <line x1="820" y1="662" x2="164" y2="662" class="ret" marker-end="url(#arrow)"/>
  <text x="492" y="654" text-anchor="middle" class="m"><tspan class="b">⑦ </tspan>200 { view, window, live, width, height, scale, capturedAt, png }</text>

  <!-- 8 print -->
  <rect x="24" y="680" width="420" height="98" rx="6" fill="#e8f4f8" stroke="#3498db"/>
  <text x="38" y="701" class="b">⑧ The CLI prints</text>
  <text x="38" y="721" class="s">no flags: the health table · --json: the envelope, PNG in base64</text>
  <text x="38" y="740" class="s">--output FILE: writes the PNG, adds Path and Bytes</text>
  <text x="38" y="764" class="ok">The window stays on the view it was switched to.</text>
</svg>
