    <rect x="656" y="341" width="8" height="10"/><rect x="676" y="341" width="8" height="6"/><rect x="696" y="337" width="8" height="4"/>
    <rect x="716" y="331" width="8" height="10"/><rect x="736" y="327" width="8" height="14"/><rect x="756" y="329" width="8" height="12"/>
    <rect x="776" y="324" width="8" height="17"/><rect x="796" y="320" width="8" height="21"/><rect x="816" y="323" width="8" height="18"/>
    <rect x="836" y="319" width="8" height="22"/><rect x="856" y="315" width="8" height="26"/><rect x="876" y="318" width="8" height="23"/>
