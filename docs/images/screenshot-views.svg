  <line x1="624" y1="276" x2="950" y2="276" stroke="#e74c3c" stroke-dasharray="6 3"/>
  <text x="946" y="272" text-anchor="end" class="v" style="fill:#e74c3c">SL 1.09600</text>
  <!-- candles -->
  <g>
    <line x1="660" y1="250" x2="660" y2="280" stroke="#27ae60"/><rect x="655" y="256" width="10" height="16" fill="#27ae60"/>
