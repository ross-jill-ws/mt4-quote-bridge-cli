    <line x1="780" y1="200" x2="780" y2="230" stroke="#27ae60"/><rect x="775" y="206" width="10" height="18" fill="#27ae60"/>
    <line x1="800" y1="190" x2="800" y2="218" stroke="#27ae60"/><rect x="795" y="195" width="10" height="16" fill="#27ae60"/>
    <line x1="820" y1="192" x2="820" y2="222" stroke="#e74c3c"/><rect x="815" y="198" width="10" height="17" fill="#e74c3c"/>
    <line x1="840" y1="182" x2="840" y2="210" stroke="#27ae60"/><rect x="835" y="187" width="10" height="16" fill="#27ae60"/>
