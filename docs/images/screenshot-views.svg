<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">What each screenshot shows</title>
  <desc id="desc">Schematic of the two captures. screenshot feeds shows the Feeds view: the left rail with the Live status, and per terminal a group of feeds with symbol, bid, ask, spread, quote time, status and record. screenshot chart shows the Charts view of one market from its best source feed: candles, indicators, the Ask line and trade lines.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #2c3e50; }
      .title { font-size: 18px; font-weight: 700; }
      .cmd { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 13px; font-weight: 700; fill: #2c3e50; }
      .nav { font-size: 11px; fill: #d5dbdb; }
      .navon { font-size: 11px; fill: #ffffff; font-weight: 700; }
      .h { font-size: 12px; font-weight: 700; }
      .c { font-size: 10.5px; fill: #566573; }
      .v { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 10.5px; fill: #2c3e50; }
      .tag { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .n { font-size: 12.5px; fill: #34495e; }
      .nb { font-size: 12.5px; font-weight: 700; fill: #2c3e50; }
      .foot { font-size: 11.5px; fill: #7f8c8d; font-style: italic; }
    </style>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="20" y="30" class="title">What the PNG shows, and what to look for</text>

  <!-- ===== Feeds ===== -->
  <text x="20" y="58" class="cmd">screenshot feeds</text>
  <rect x="20" y="68" width="450" height="320" rx="6" fill="#f8f9fa" stroke="#2c3e50"/>
  <rect x="20" y="68" width="450" height="20" rx="6" fill="#2c3e50"/>
  <text x="30" y="82" class="tag">QuoteBridge</text>
  <rect x="21" y="88" width="100" height="299" fill="#34495e"/>
  <text x="32" y="110" class="navon">Feeds</text>
  <rect x="26" y="99" width="3" height="15" fill="#3498db"/>
  <text x="32" y="130" class="nav">Terminals</text>
  <text x="32" y="150" class="nav">Charts</text>
  <text x="32" y="170" class="nav">Trading</text>
  <text x="32" y="190" class="nav">History</text>
  <text x="32" y="210" class="nav">Indicators</text>
  <text x="32" y="230" class="nav">Settings</text>
  <circle cx="34" cy="366" r="4" fill="#2ecc71"/>
  <text x="44" y="370" class="navon">Live</text>
  <!-- group 1 -->
  <text x="134" y="112" class="h">Demo terminal</text>
  <text x="230" y="112" class="v">mt4-aaaaaaaaaaaa</text>
  <circle cx="376" cy="108" r="3.5" fill="#2ecc71"/>
  <text x="384" y="112" class="c">Online</text>
  <rect x="134" y="120" width="326" height="16" fill="#eaf2f8"/>
  <text x="138" y="132" class="c">Symbol</text><text x="196" y="132" class="c">Bid</text><text x="246" y="132" class="c">Ask</text><text x="294" y="132" class="c">Spread</text><text x="340" y="132" class="c">Quote time</text><text x="406" y="132" class="c">Status</text>
  <text x="138" y="151" class="v">EURUSD</text><text x="190" y="151" class="v">1.10000</text><text x="240" y="151" class="v">1.10015</text><text x="300" y="151" class="v">15</text><text x="340" y="151" class="v">10:00:00</text><text x="406" y="151" class="c">Live</text>
  <text x="138" y="169" class="v">GBPUSD</text><text x="190" y="169" class="v">1.27010</text><text x="240" y="169" class="v">1.27028</text><text x="300" y="169" class="v">18</text><text x="340" y="169" class="v">10:00:00</text><text x="406" y="169" class="c">Live</text>
  <text x="138" y="187" class="v">USDJPY</text><text x="190" y="187" class="v">151.204</text><text x="240" y="187" class="v">151.219</text><text x="300" y="187" class="v">15</text><text x="340" y="187" class="v">09:59:58</text><text x="406" y="187" class="c">Live</text>
  <!-- group 2, quiet -->
  <text x="134" y="226" class="h">Second terminal</text>
  <text x="240" y="226" class="v">mt4-bbbbbbbbbbbb</text>
  <circle cx="376" cy="222" r="3.5" fill="#95a5a6"/>
  <text x="384" y="226" class="c">Offline</text>
  <rect x="134" y="234" width="326" height="16" fill="#eaf2f8"/>
  <text x="138" y="246" class="c">Symbol</text><text x="196" y="246" class="c">Bid</text><text x="246" y="246" class="c">Ask</text><text x="294" y="246" class="c">Spread</text><text x="340" y="246" class="c">Quote time</text><text x="406" y="246" class="c">Status</text>
  <text x="138" y="265" class="v">XAUUSD</text><text x="190" y="265" class="v">2031.10</text><text x="240" y="265" class="v">2031.45</text><text x="300" y="265" class="v">35</text><text x="340" y="265" class="v">09:41:12</text><text x="406" y="265" class="c" style="fill:#c0392b">Stale</text>
  <!-- callouts -->
  <circle cx="60" cy="350" r="9" fill="#e67e22"/><text x="60" y="354" text-anchor="middle" class="tag">1</text>
  <circle cx="452" cy="108" r="9" fill="#e67e22"/><text x="452" y="112" text-anchor="middle" class="tag">2</text>
  <circle cx="452" cy="170" r="9" fill="#e67e22"/><text x="452" y="174" text-anchor="middle" class="tag">3</text>
  <circle cx="452" cy="265" r="9" fill="#e67e22"/><text x="452" y="269" text-anchor="middle" class="tag">4</text>

  <text x="20" y="414" class="nb">Healthy Feeds</text>
  <text x="20" y="436" class="n"><tspan class="nb">1</tspan>  Live status: Live, not Connecting…, Reconnecting… or Disconnected</text>
  <text x="38" y="453" class="n">(the "live" field: live, connecting, reconnecting, session-ended).</text>
  <text x="20" y="475" class="n"><tspan class="nb">2</tspan>  Every terminal you expect has a group, marked online.</text>
  <text x="20" y="497" class="n"><tspan class="nb">3</tspan>  Quote times move; bid and ask look sane; spreads are normal.</text>
  <text x="20" y="519" class="n"><tspan class="nb">4</tspan>  A stale or offline row is what to investigate next:</text>
  <text x="38" y="536" class="n">terminals list, terminals feeds ID, markets quote SYMBOL.</text>

  <!-- ===== Chart ===== -->
  <text x="510" y="58" class="cmd">screenshot chart EURUSD --broker EasyForex-Demo</text>
  <rect x="510" y="68" width="450" height="320" rx="6" fill="#f8f9fa" stroke="#2c3e50"/>
  <rect x="510" y="68" width="450" height="20" rx="6" fill="#2c3e50"/>
  <text x="520" y="82" class="tag">QuoteBridge</text>
  <rect x="511" y="88" width="100" height="299" fill="#34495e"/>
  <text x="522" y="110" class="nav">Feeds</text>
  <text x="522" y="130" class="nav">Terminals</text>
  <text x="522" y="150" class="navon">Charts</text>
  <rect x="516" y="139" width="3" height="15" fill="#3498db"/>
