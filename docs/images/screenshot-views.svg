  <text x="630" y="318" class="c">MACD</text>
  <!-- callouts -->
  <circle cx="614" cy="106" r="9" fill="#e67e22"/><text x="614" y="110" text-anchor="middle" class="tag">1</text>
  <circle cx="940" cy="200" r="9" fill="#e67e22"/><text x="940" y="204" text-anchor="middle" class="tag">2</text>
  <circle cx="614" cy="232" r="9" fill="#e67e22"/><text x="614" y="236" text-anchor="middle" class="tag">3</text>
  <circle cx="614" cy="340" r="9" fill="#e67e22"/><text x="614" y="344" text-anchor="middle" class="tag">4</text>

  <text x="510" y="414" class="nb">Healthy chart</text>
  <text x="510" y="436" class="n"><tspan class="nb">1</tspan>  The market you named, at the period the window remembers.</text>
  <text x="510" y="458" class="n"><tspan class="nb">2</tspan>  Candles up to now, the Ask line at the current price.</text>
  <text x="510" y="480" class="n"><tspan class="nb">3</tspan>  Open trades and their stops, unless trade lines are off.</text>
  <text x="510" y="502" class="n"><tspan class="nb">4</tspan>  Every indicator on the chart has drawn its values.</text>
  <text x="510" y="524" class="n">Still loading after six seconds? It is captured as it is:</text>
  <text x="510" y="541" class="n">check markets candles and markets show for that market.</text>

  <rect x="20" y="566" width="940" height="56" rx="8" fill="#fef5e7" stroke="#f39c12"/>
  <text x="36" y="589" class="n"><tspan class="nb">Read data from data commands.</tspan> A screenshot shows that the app looks right; the numbers come from</text>
  <text x="36" y="608" class="n">markets quote, markets candles, markets indicator and accounts funds, never from reading a picture.</text>
  <text x="960" y="636" text-anchor="end" class="foot">Schematic: what to look for, not the app's exact look.</text>
</svg>
